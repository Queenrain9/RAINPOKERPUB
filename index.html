<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#15110d" />
  <title>RAIN POKER PUB</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main id="app" class="app-shell">
    <section id="landing" class="screen landing-screen" aria-labelledby="game-title">
      <div id="landing-game" class="landing-game" aria-hidden="true"></div>
      <div class="landing-shade"></div>
      <div class="landing-content">
        <div class="brand-mark">RAIN</div>
        <h1 id="game-title">POKER PUB</h1>
        <p class="tagline">작은 홀덤펍 하나에서 시작하세요.</p>
        <button id="start-button" class="primary-button" type="button">게임 시작</button>
        <button id="login-button" class="text-button" type="button">이미 계정이 있어요</button>
      </div>
    </section>

    <section id="auth" class="screen auth-screen" hidden>
      <button id="auth-back" class="back-button" type="button" aria-label="처음 화면으로">←</button>
      <div class="auth-card">
        <div class="brand-mark brand-mark--small">RAIN</div>
        <h2 id="auth-title">계정 만들기</h2>
        <form id="auth-form">
          <label>
            <span>이메일</span>
            <input id="email" name="email" type="email" autocomplete="email" required />
          </label>
          <label>
            <span>비밀번호</span>
            <input id="password" name="password" type="password" minlength="8" autocomplete="new-password" required />
          </label>
          <p id="auth-status" class="auth-status" role="status"></p>
          <button id="auth-submit" class="primary-button" type="submit">계정 만들기</button>
        </form>
        <button id="auth-switch" class="text-button" type="button">로그인으로 전환</button>
      </div>
    </section>

    <section id="loading" class="screen auth-screen" hidden>
      <div class="loading-card">
        <div class="brand-mark brand-mark--small">RAIN</div>
        <p id="loading-message">세이브를 불러오는 중…</p>
      </div>
    </section>

    <section id="pub-setup" class="screen auth-screen" hidden>
      <div class="auth-card">
        <p class="eyebrow">NEW PUB</p>
        <h2>내 펍의 이름을 정해주세요.</h2>
        <form id="pub-name-form">
          <label>
            <span>펍 이름</span>
            <input id="pub-name" maxlength="20" minlength="2" autocomplete="off" placeholder="예: RAIN Poker Club" required />
          </label>
          <p id="pub-name-status" class="auth-status" role="status"></p>
          <button id="pub-name-submit" class="primary-button" type="submit">이 이름으로 시작</button>
        </form>
      </div>
    </section>

    <section id="game" class="screen game-screen" hidden>
      <div id="pub-game" class="pub-game" aria-label="홀덤펍 게임 맵"></div>

      <header class="game-hud">
        <div class="hud-left">
          <strong id="hud-pub-name">RAIN POKER PUB</strong>
          <span id="hud-calendar">1주차 · 월요일</span>
        </div>
        <div class="hud-right">
          <strong id="hud-cash">0G</strong>
          <span id="hud-status">영업 전</span>
        </div>
      </header>

      <div id="save-indicator" class="save-indicator">저장됨</div>

      <div id="system-message" class="system-message" role="status">
        먼저 포커 테이블을 준비해볼까요? 메뉴를 눌러보세요.
      </div>

      <button id="start-business" class="start-business-button" type="button" hidden>
        영업 시작
      </button>

      <button id="floating-menu" class="floating-menu-button" type="button" aria-label="게임 메뉴">
        ☰
        <span>메뉴</span>
      </button>

      <div id="sheet-backdrop" class="sheet-backdrop" hidden></div>
      <aside id="action-sheet" class="action-sheet" hidden aria-live="polite">
        <div class="sheet-handle"></div>
        <div id="sheet-content"></div>
      </aside>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script>
  <script type="module" src="./src/app.js"></script>
</body>
</html>
