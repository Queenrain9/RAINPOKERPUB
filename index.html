<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#15110d" />
  <title>RAIN POKER PUB</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main id="app" class="app-shell">
    <section id="landing" class="screen landing-screen" aria-labelledby="game-title">
      <div id="landing-game" class="landing-game" aria-hidden="true"></div>
      <div class="landing-shade"></div>
      <div class="landing-content">
        <div class="brand-mark">RAIN</div>
        <h1 id="game-title">POKER PUB</h1>
        <p class="tagline">작은 홀덤펍 하나에서 시작하세요.</p>
        <button id="start-button" class="primary-button" type="button">게임 시작</button>
        <button id="login-button" class="text-button" type="button">이미 계정이 있어요</button>
      </div>
    </section>

    <section id="auth" class="screen auth-screen" hidden>
      <button id="auth-back" class="back-button" type="button" aria-label="처음 화면으로">←</button>
      <div class="auth-card">
        <div class="brand-mark brand-mark--small">RAIN</div>
        <h2 id="auth-title">계정 만들기</h2>
        <form id="auth-form">
          <label>
            <span>이메일</span>
            <input id="email" name="email" type="email" autocomplete="email" required />
          </label>
          <label>
            <span>비밀번호</span>
            <input id="password" name="password" type="password" minlength="8" autocomplete="new-password" required />
          </label>
          <p id="auth-status" class="auth-status" role="status"></p>
          <button id="auth-submit" class="primary-button" type="submit">계정 만들기</button>
        </form>
        <button id="auth-switch" class="text-button" type="button">로그인으로 전환</button>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script>
  <script type="module" src="./src/app.js"></script>
</body>
</html>
