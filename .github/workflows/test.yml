name: Engine tests

on:
  push:
    branches: ["main"]
    paths:
      - "src/game/**"
      - "tests/**"
      - "package.json"
      - ".github/workflows/test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run engine tests
        run: npm test
